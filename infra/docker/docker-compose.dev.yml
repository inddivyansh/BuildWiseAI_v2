version: "3.9"

services:
  # --- Backend API ---
  backend:
    build: ../../backend
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
      - generated_files:/tmp/archigen
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=archigen_dev
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - neo4j
    command: uvicorn planlint.api.main:app --host 0.0.0.0 --port 8000 --reload

  # --- Redis (task queue + caching) ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # --- Neo4j (compliance knowledge graph) ---
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"  # Browser
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/archigen_dev
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  # --- Ollama (local LLM for dev) ---
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # After first start, run: docker exec -it archigen-ollama-1 ollama pull qwen3:8b

  # --- Celery Worker (async generation jobs) ---
  worker:
    build: ../../backend
    volumes:
      - ../../backend:/app
      - generated_files:/tmp/archigen
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - ollama
    command: celery -A app.worker worker --loglevel=info

volumes:
  redis_data:
  neo4j_data:
  ollama_models:
  generated_files:
